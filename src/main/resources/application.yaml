spring:
  application:
    name: discodeit

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/discodeit}
    username: ${SPRING_DATASOURCE_USERNAME:discodeit}
    password: ${SPRING_DATASOURCE_PASSWORD:discodeit}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # Redis 설정
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # Kafka 설정
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest
      group-id: ${spring.application.name}-sse-${random.uuid}
      properties:
        spring.json.trusted.packages: "com.example.discodeit.domain.event"

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

# JWT 설정
jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long}
  access-token-expiry: 3600    # 1시간 (초)
  refresh-token-expiry: 604800  # 7일 (초)

server:
  port: 8080

---
# kafka 프로파일
spring:
  config:
    activate:
      on-profile: kafka

---
# test 프로파일
spring:
  config:
    activate:
      on-profile: test
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    consumer:
      group-id: discodeit-test