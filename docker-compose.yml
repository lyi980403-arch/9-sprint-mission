version: "3.8"

services:

  # ──────────────────────────────────────────
  # Reverse Proxy (Nginx)
  # ──────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - discodeit-net
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Backend (Spring Boot) — 3 replicas
  # ──────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-discodeit-backend:latest}
    # docker compose up --scale backend=3 으로도 조정 가능
    deploy:
      replicas: 3
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-discodeit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-discodeit}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-discodeit}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
      # Kafka 프로파일 활성화
      SPRING_PROFILES_ACTIVE: kafka
      # JWT 서명 키 (모든 인스턴스 동일해야 함)
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-must-be-long-enough}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      - discodeit-net
    restart: unless-stopped

  # ──────────────────────────────────────────
  # DB (PostgreSQL)
  # ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discodeit}
      POSTGRES_USER: ${POSTGRES_USER:-discodeit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discodeit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - discodeit-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discodeit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Memory DB (Redis)
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - discodeit-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Message Broker (Kafka) — KRaft 모드 (ZooKeeper 불필요)
  # ──────────────────────────────────────────
  broker:
    image: confluentinc/cp-kafka:7.6.1
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,EXTERNAL://broker:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk  # 고정 Cluster ID (base64, 22자)
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - discodeit-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server broker:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

networks:
  discodeit-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
