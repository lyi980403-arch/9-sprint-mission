worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ─────────────────────────────────────────────────────────
    # upstream: backend 서비스 (Docker Compose scale로 생성된
    # 컨테이너를 DNS 라운드로빈으로 동적 해석)
    # ─────────────────────────────────────────────────────────
    upstream backend_servers {

        server backend:8080;

        keepalive 32;
    }

    # ─────────────────────────────────────────────────────────
    # 로그 포맷 — 실제 upstream 서버 IP 포함
    # ─────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr '       # ← 어느 백엔드가 처리했는지
                    'upstream_rt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        # ── REST API ────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # 실제 요청을 처리한 upstream 서버 IP를 응답 헤더에 추가
            # → 브라우저 개발자 도구 Network 탭에서 확인 가능
            add_header         X-Handled-By      $upstream_addr always;

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # ── WebSocket ───────────────────────────────────────
        location /ws/ {
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;

            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            add_header         X-Handled-By      $upstream_addr always;

            proxy_read_timeout 3600s;  # WebSocket 장기 연결
        }

        # ── SSE (Server-Sent Events) ─────────────────────────
        # SSE는 장기 HTTP 연결 → buffering 비활성화 필수
        location /api/notifications/connect {
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";

            # SSE 버퍼링 비활성화 (청크 단위 스트리밍)
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 86400s;  # 24시간

            add_header         X-Handled-By      $upstream_addr always;
            add_header         Cache-Control     "no-cache" always;
        }

        # ── Health Check ─────────────────────────────────────
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}